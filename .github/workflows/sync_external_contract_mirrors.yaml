name: Sync external contract mirrors

on:
  workflow_dispatch:
  schedule:
    - cron: '18 10 * * *'

jobs:
  sync-tinynode-provider-contract:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TinyPen
        uses: actions/checkout@v4

      - name: Fetch upstream TinyNode seam baseline
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/cubap/rerum_openapi/main/seams/tpen-services-to-tinynode/openapi/baseline.openapi.yaml \
            -o openapi/external/tpen-services-to-tinynode.openapi.yaml.latest

      - name: Update local mirror when upstream changed
        run: |
          if cmp -s openapi/external/tpen-services-to-tinynode.openapi.yaml openapi/external/tpen-services-to-tinynode.openapi.yaml.latest; then
            rm openapi/external/tpen-services-to-tinynode.openapi.yaml.latest
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mv openapi/external/tpen-services-to-tinynode.openapi.yaml.latest openapi/external/tpen-services-to-tinynode.openapi.yaml
          echo "changed=true" >> "$GITHUB_OUTPUT"
        id: sync

      - name: Create sync pull request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(openapi): sync TinyNode external contract mirror"
          branch: automation/sync-tinynode-external-contract
          delete-branch: true
          title: "chore(openapi): sync TinyNode external contract mirror"
          body: |
            Automated sync of the vendored TinyNode seam baseline used by TinyPen.

            - Source: `cubap/rerum_openapi/seams/tpen-services-to-tinynode/openapi/baseline.openapi.yaml`
            - Target: `openapi/external/tpen-services-to-tinynode.openapi.yaml`
