name: Sync TinyPen provider contract artifact

on:
  push:
    branches:
      - main
    paths:
      - routes/**
      - app.js
      - openapi/contracts/tpen-services-to-tinypen.openapi.yaml
  workflow_dispatch:

jobs:
  dispatch-sync:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch sync-provider-artifact workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OPENAPI }}
          script: |
            await github.request('POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches', {
              owner: 'cubap',
              repo: 'rerum_openapi',
              workflow_id: 'sync-provider-artifact.yml',
              ref: 'main',
              inputs: {
                provider_repository: '${{ github.repository }}',
                provider_ref: '${{ github.sha }}',
                provider_artifact_path: 'openapi/contracts/tpen-services-to-tinypen.openapi.yaml',
                target_artifact_path: 'seams/tpen-services-to-tinypen/openapi/baseline.openapi.yaml'
              }
            })
