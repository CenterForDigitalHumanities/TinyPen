name: Sync TinyPen provider contract artifact

on:
  push:
    branches:
      - main
    paths:
      - routes/**
      - app.js
      - openapi/contracts/tpen-services-to-tinypen.openapi.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync TinyPen provider contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TinyPen
        uses: actions/checkout@v4

      - name: Checkout receiver repository
        uses: actions/checkout@v4
        with:
          repository: cubap/rerum_openapi
          ref: main
          token: ${{ secrets.OPENAPI }}
          path: receiver

      - name: Verify receiver stub exists
        run: test -f receiver/seams/tpen-services-to-tinypen/openapi/baseline.openapi.yaml

      - name: Copy canonical provider contract
        run: cp openapi/contracts/tpen-services-to-tinypen.openapi.yaml receiver/seams/tpen-services-to-tinypen/openapi/baseline.openapi.yaml

      - name: Create or update sync pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.OPENAPI }}
          path: receiver
          add-paths: seams/tpen-services-to-tinypen/openapi/baseline.openapi.yaml
          commit-message: "chore: sync TinyPen provider contract"
          branch: sync/tinypen-provider-contract
          base: main
          delete-branch: true
          title: "chore: sync TinyPen provider contract"
          body: |
            Syncs the canonical TinyPen provider contract from CenterForDigitalHumanities/TinyPen.

            - Source commit: ${{ github.sha }}
            - Source artifact: `openapi/contracts/tpen-services-to-tinypen.openapi.yaml`
            - Target artifact: `seams/tpen-services-to-tinypen/openapi/baseline.openapi.yaml`
